name: CI CD pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_call:

  pull_request:
    branches:
      - main
      - master

jobs:
  rust_style:
    name: Rust Styling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: grain-wasm
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run Cargo clippy
        run: cargo clippy --all-targets --all-features
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grain-wasm
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: NPM install
        run: npm i
      - name: Build (wasm + TypeScript)
        run: npm run build
      - name: ESLint
        run: npm run lint

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: grain-wasm
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  rust_test:
    name: Rust testing
    runs-on: ubuntu-latest
    needs: [rust_style]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: grain-wasm
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Run cargo test
        run: cargo test --all-features


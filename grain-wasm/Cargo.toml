[package]
name = "grain-wasm"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dependencies]
rhai = { git = "https://github.com/rhaiscript/rhai", default-features = false, features = ["std", "grain"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
